<!DOCTYPE html>
<html lang="en">
    <head>
        <title>TO-DO app</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                padding: 20px;
            }
            h1 {
                margin-bottom: 20px;
            }
            #taskInput {
                padding: 10px;
                width: 250px;
            }
            #addTaskButton {
                padding: 10px 15px;
                margin-left: 10px;
            }
            #taskList {
                margin-top: 20px;
            }
            li {
                margin-bottom: 10px;
                display: flex;
                justify-content: space-between;
                width: 300px;
            }
            button {
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
        <h1>TO DO LIST</h1>
        <!-- Input and button-->
        <input type="text" id="taskInput" placeholder="Enter a new task">
        <button id="addTaskButton">Add Task</button>
        <!--Task list container-->
        <ul id="taskList"></ul>

        <script src="script.js"></script>
    </body>
</html>
